name: CI

on:
  pull_request:
    paths-ignore:
      - CHANGELOG.md
  push:
    branches:
      - master
    paths-ignore:
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm install

      - name: Check code style
        run: composer lint:check

      - name: Run static analysis
        run: composer analyze

      - name: Run test suite
        run: ./vendor/bin/pest tests/Feature --ci --no-coverage

      - name: Build component CSS
        run: ./vendor/bin/testbench basekit:ui:build

      - name: Generate styleguide snapshot
        run: ./vendor/bin/testbench basekit:ui:styleguide

      - name: Generate advanced demo snapshot
        run: composer advanced-demo

      - name: Verify CSS-doc token sync
        run: bash tools/verify-doc-token-sync.sh

  browser:
    name: Browser Tests
    needs: quality
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
            libxcb1 libx11-6 libx11-xcb1 libxext6 libxfixes3 \
            fonts-liberation

      - name: Install Chrome for Testing
        run: composer test:browser:setup

      - name: Run browser tests
        run: composer test:browser -- --no-coverage
